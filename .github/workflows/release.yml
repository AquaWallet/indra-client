name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# The organization defaults the token to read-only; creating the release needs write
permissions:
  contents: write

jobs:
  build:
    name: Build binaries

    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Build binaries
        run: make binaries

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            boltz-client-*.tar.gz
            boltz-client-manifest-*.txt
          draft: true
          body: |
            # Summary
            
            TODO
            
            # Highlights
            
            TODO
            
            # Verifying the Release

            Verify that the hashes match the archive you've downloaded.
            
            ```
            sha256sum --ignore-missing -c boltz-client-manifest-${{ env.RELEASE_VERSION }}.txt
            ```
            
            If your archive is valid, you should see the following output (depending on the archive you've downloaded):
            
            ```
            boltz-client-linux-amd64-${{ env.RELEASE_VERSION }}.tar.gz: OK
            ```
